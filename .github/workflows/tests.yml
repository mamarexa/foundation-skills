name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renderers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx python-pptx matplotlib
      - run: python tests/test_scripts.py
